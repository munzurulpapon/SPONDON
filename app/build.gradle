
plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// ---- Secrets (never commit real keys) ------------------------------------
// MAPTILER_API_KEY is read from local.properties (git-ignored) or from an
// environment variable (useful for CI). It is exposed to the app as
// R.string.maptiler_api_key, so no Java code needs to change.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def maptilerApiKey = localProps.getProperty('MAPTILER_API_KEY') ?: System.getenv('MAPTILER_API_KEY') ?: ''
if (maptilerApiKey.isEmpty()) {
    logger.warn('WARNING: MAPTILER_API_KEY is not set in local.properties - map tiles will not load.')
}
// --------------------------------------------------------------------------

android {
    namespace 'com.example.spondon'
    compileSdk 32

    defaultConfig {
        applicationId "com.example.spondon"
        minSdk 21
        targetSdk 32
        versionCode 1
        versionName "1.0"
        resValue "string", "maptiler_api_key", maptilerApiKey

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {

    // Existing Android dependencies
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:31.2.3')



    // Firebase Analytics
    implementation 'com.google.firebase:firebase-analytics'

    // Firebase Authentication
    implementation 'com.google.firebase:firebase-auth'

    // Cloud Firestore
    implementation 'com.google.firebase:firebase-firestore'

    // Firebase Storage
    implementation 'com.google.firebase:firebase-storage'
    // Firebase Realtime Database
    implementation 'com.google.firebase:firebase-database'

    // Firebase Cloud Messaging
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}
